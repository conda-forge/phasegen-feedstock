{% set name = "phasegen" %}
{% set version = "2.0.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/phasegen-{{ version }}.tar.gz
  sha256: a410a5a5c9d187a3036aaf4bb416c364b0e9dfdc6e407697a502feae6c3c2e41

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core
    - pip
  run:
    - python >={{ python_min }},<3.14
    - typing_extensions >=4.11.0,<5.0.0
    - matplotlib-base >=3.8.4,<4.0.0
    - seaborn >=0.13.2,<0.14.0
    - numpy >=1.26.4
    - pandas >=2.2.2,<3.0.0
    - jsonpickle >=3.0.4,<4.0.0
    - multiprocess >=0.70.16,<0.71.0
    - pyyaml >=6.0.1,<7.0.0
    - tqdm >=4.66.2,<5.0.0
    - scipy >=1.13.0,<2.0.0
    - fastdfe >=1.1.5
    - numba >=0.59

test:
  imports:
    - phasegen
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Computation and inference on exact solutions of coalescent distributions under diverse demographic scenarios.
  license: GPL-3.0-only
  license_file: LICENSE
  home: https://pypi.org/project/phasegen/
  dev_url: https://github.com/Sendrowski/phasegen
  doc_url: https://phasegen.readthedocs.io

extra:
  recipe-maintainers:
    - Sendrowski
